<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>हिंदी शब्द कोश · 500 Words</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Mukta:wght@400;500;700&display=swap">
<style>
/* Layout: a school-notebook study tool. Sticky tab bar, level chips, card grid; flashcards and quiz reuse the same card surface. */
:root{
  --bg:#f3f6fb; --surface:#ffffff; --ink:#1b2a4a; --muted:#5b6782; --line:#dbe2ee;
  --accent:#2f5bd3; --accent-soft:#e6edff; --marigold:#f2a516; --marigold-soft:#fff3d9;
  --good:#1e8a5a; --good-soft:#e2f5ec; --bad:#c23b3b; --bad-soft:#fbe7e7;
  --display:"Baloo 2","Mukta",system-ui,sans-serif; --body:"Mukta",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1626; --surface:#18223a; --ink:#e6ecf8; --muted:#9aa6c2; --line:#2a3655;
  --accent:#86a6ff; --accent-soft:#22305a; --marigold:#f5b83d; --marigold-soft:#3a2f17;
  --good:#5fd39c; --good-soft:#163a2b; --bad:#ff8a8a; --bad-soft:#3d1d22; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1626; --surface:#18223a; --ink:#e6ecf8; --muted:#9aa6c2; --line:#2a3655;
  --accent:#86a6ff; --accent-soft:#22305a; --marigold:#f5b83d; --marigold-soft:#3a2f17;
  --good:#5fd39c; --good-soft:#163a2b; --bad:#ff8a8a; --bad-soft:#3d1d22; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
.back-link{display:inline-block;margin-bottom:10px;color:var(--accent);text-decoration:none;font-weight:600}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{padding-block:28px 12px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2rem,5vw,2.8rem);line-height:1.1;margin:0;text-wrap:balance}
h1 span{color:var(--accent)}
.sub{color:var(--muted);margin:6px 0 0;max-width:62ch}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{font:600 1rem var(--body);background:none;border:0;color:var(--muted);padding:12px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:3px solid var(--marigold);outline-offset:2px}
main{padding-block:18px 48px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 .92rem var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.chip small{opacity:.75;font-weight:500}
#search{flex:1 1 240px;min-width:0;font:1rem var(--body);padding:9px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.count{color:var(--muted);font-size:.92rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.known{border-color:var(--good)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.word{font-family:var(--display);font-weight:700;font-size:1.7rem;line-height:1.1}
.num{font-size:.75rem;color:var(--muted);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.meaning{font-weight:700;color:var(--accent);font-size:1.05rem}
.row{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:.95rem;align-items:baseline}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding-top:2px}
.lbl.syn{color:var(--accent)} .lbl.ant{color:var(--bad)}
.hi{font-weight:500} .en{color:var(--muted)}
.none{color:var(--muted)}
.actions{display:flex;gap:6px;margin-top:2px}
.mini{font:600 .82rem var(--body);border:1px solid var(--line);background:none;color:var(--muted);border-radius:8px;padding:3px 9px;cursor:pointer}
.mini.on{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.lvtag{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--marigold-soft);color:var(--ink);white-space:nowrap}
.progress{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.pbox{flex:1 1 150px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.pbox b{font-family:var(--display);font-size:1.1rem}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
/* flashcards */
.fc-area{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.flash{background:var(--surface);border:2px solid var(--line);border-radius:18px;min-height:300px;padding:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;cursor:pointer}
.flash .word{font-size:3rem}
.flash .hint{color:var(--muted);font-size:.9rem}
.flash .back{width:100%;text-align:left;display:flex;flex-direction:column;gap:10px}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{font:700 1rem var(--body);padding:10px 18px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.good{border-color:var(--good);color:var(--good)}
.btn.bad{border-color:var(--bad);color:var(--bad)}
/* quiz */
.q-word{font-family:var(--display);font-size:2.6rem;font-weight:700;text-align:center;line-height:1.15}
.q-ask{text-align:center;color:var(--muted)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
.opt{font:600 1.05rem var(--body);text-align:left;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.score{text-align:center;font-family:var(--display);font-size:1.2rem}
.empty{color:var(--muted);text-align:center;padding:40px 0}
@media (prefers-reduced-motion:no-preference){.flash,.opt,.chip{transition:border-color .15s,background .15s}}
</style>
</head>
<body>
<header class="wrap">
  <a class="back-link" href="../../../../index.html">← Study Hub</a>
  <h1>हिंदी <span>शब्द कोश</span></h1>
  <p class="sub">500 Hindi words for Class 6, from easy to hard. Each word has its English meaning, पर्यायवाची (synonyms) and विलोम (antonyms) in Hindi and English.</p>
</header>
<nav class="tabs" aria-label="Sections"><div class="wrap" role="tablist">
  <button role="tab" id="tab-list" aria-selected="true" data-view="list">शब्द सूची · Word list</button>
  <button role="tab" id="tab-flash" aria-selected="false" data-view="flash">फ़्लैशकार्ड · Flashcards</button>
  <button role="tab" id="tab-quiz" aria-selected="false" data-view="quiz">क्विज़ · Quiz</button>
</div></nav>

<main class="wrap">
  <div class="controls">
    <div class="chips" id="levels"></div>
  </div>

  <section id="view-list">
    <div class="progress" id="progress"></div>
    <div class="controls">
      <input id="search" type="search" placeholder="Search in Hindi or English… (e.g. सुंदर, brave)">
      <span class="count" id="count"></span>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="view-flash" hidden>
    <div class="fc-area">
      <div class="controls" style="justify-content:center"><label class="count"><input type="checkbox" id="onlyNew"> Only words I don't know yet</label></div>
      <div class="flash" id="flash" tabindex="0" role="button" aria-label="Flip card"></div>
      <div class="btns">
        <button class="btn bad" id="fcAgain">फिर से · Again</button>
        <button class="btn good" id="fcKnow">आता है · I know it</button>
      </div>
      <p class="count" style="text-align:center" id="fcInfo"></p>
    </div>
  </section>

  <section id="view-quiz" hidden>
    <div class="fc-area" id="quiz"></div>
  </section>
</main>

LEVELS.forEach((L,li)=>{L.data.trim().split("\n").forEach(line=>{
  const p=line.split("|").map(s=>s.trim());
  if(p.length<6)return;
  WORDS.push({id:WORDS.length+1,lv:li,hi:p[0],en:p[1],hs:p[2],es:p[3],ha:p[4],ea:p[5]});
});});

const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let known=new Set(store.get("sk-known",[]));
let level=store.get("sk-level",-1);
let view="list";
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const val=s=>s==="-"?'<span class="none">—</span>':esc(s);
const inLevel=()=>level<0?WORDS:WORDS.filter(w=>w.lv===level);
function saveKnown(){store.set("sk-known",[...known])}

function renderLevels(){
  const all=[{i:-1,label:"सभी · All",n:WORDS.length}].concat(LEVELS.map((L,i)=>({i,label:`${L.name} · ${L.en}`,n:WORDS.filter(w=>w.lv===i).length})));
  $("#levels").innerHTML=all.map(c=>`<button class="chip" data-lv="${c.i}" aria-pressed="${c.i===level}">${c.label} <small>${c.n}</small></button>`).join("");
}
function renderProgress(){
  $("#progress").innerHTML=LEVELS.map((L,i)=>{const ws=WORDS.filter(w=>w.lv===i),k=ws.filter(w=>known.has(w.id)).length;
    return `<div class="pbox"><b>${L.name}</b> <span class="count">${L.en}</span><div class="count">${k} / ${ws.length} learnt</div><div class="bar"><i style="width:${ws.length?k/ws.length*100:0}%"></i></div></div>`}).join("");
}
function cardBody(w){
  return `<div class="meaning">${esc(w.en)}</div>
  <div class="row"><span class="lbl syn">पर्यायवाची</span><span><span class="hi">${val(w.hs)}</span></span>
  <span class="lbl syn">Synonyms</span><span class="en">${val(w.es)}</span></div>
  <div class="row"><span class="lbl ant">विलोम</span><span><span class="hi">${val(w.ha)}</span></span>
  <span class="lbl ant">Antonym</span><span class="en">${val(w.ea)}</span></div>`;
}
function renderList(){
  const q=$("#search").value.trim().toLowerCase();
  const list=inLevel().filter(w=>!q||[w.hi,w.en,w.hs,w.es,w.ha,w.ea].join(" ").toLowerCase().includes(q));
  $("#count").textContent=`${list.length} words`;
  $("#grid").innerHTML=list.length?list.map(w=>`<article class="card${known.has(w.id)?" known":""}">
    <div class="top"><div><div class="num">#${w.id}</div><div class="word" lang="hi">${esc(w.hi)}</div></div><span class="lvtag">${LEVELS[w.lv].en}</span></div>
    ${cardBody(w)}
    <div class="actions"><button class="mini${known.has(w.id)?" on":""}" data-know="${w.id}">${known.has(w.id)?"✓ Learnt":"Mark as learnt"}</button><button class="mini" data-say="${w.id}">🔊 सुनो</button></div>
  </article>`).join(""):`<p class="empty">No word matches "${esc(q)}". Try another spelling.</p>`;
  renderProgress();
}
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="hi-IN";u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

/* flashcards */
let deck=[],di=0,flipped=false;
function buildDeck(){
  deck=inLevel().filter(w=>!$("#onlyNew").checked||!known.has(w.id)).map(w=>w.id).sort(()=>Math.random()-.5);di=0;flipped=false;renderFlash();
}
function renderFlash(){
  const f=$("#flash");
  if(!deck.length){f.innerHTML=`<p class="empty">शाबाश! You have learnt every word in this level. Pick another level or untick the box.</p>`;$("#fcInfo").textContent="";return}
  const w=WORDS[deck[di]-1];
  f.innerHTML=flipped?`<div class="back"><div class="word" lang="hi" style="font-size:2.2rem">${esc(w.hi)}</div>${cardBody(w)}</div>`
    :`<div class="word" lang="hi">${esc(w.hi)}</div><div class="hint">इसका अर्थ क्या है? Think of the meaning, then tap to flip.</div>`;
  $("#fcInfo").textContent=`Card ${di+1} of ${deck.length} · ${LEVELS[w.lv].name}`;
}
function nextCard(markKnown){
  if(!deck.length)return;
  const id=deck[di];
  if(markKnown){known.add(id);saveKnown();deck.splice(di,1);if(di>=deck.length)di=0}
  else{di=(di+1)%deck.length}
  flipped=false;renderFlash();
}

/* quiz */
let qz=null;
function newQuiz(){
  const pool=inLevel();
  const qs=[...pool].sort(()=>Math.random()-.5).slice(0,10);
  qz={qs,i:0,score:0,answered:false,mode:qz?qz.mode:"meaning"};renderQuiz();
}
function optsFor(w){
  const field=qz.mode==="meaning"?"en":"ha";
  const pool=WORDS.filter(x=>x.id!==w.id&&x[field]!=="-"&&x[field]!==w[field]);
  const picks=new Set();while(picks.size<3){picks.add(pool[Math.floor(Math.random()*pool.length)][field])}
  return [w[field],...picks].sort(()=>Math.random()-.5);
}
function renderQuiz(){
  const el=$("#quiz");
  const modeBar=`<div class="chips" style="justify-content:center"><button class="chip" data-mode="meaning" aria-pressed="${qz.mode==="meaning"}">अर्थ · Meaning</button><button class="chip" data-mode="antonym" aria-pressed="${qz.mode==="antonym"}">विलोम · Antonym</button></div>`;
  if(qz.mode==="antonym")qz.qs=qz.qs.filter(w=>w.ha!=="-");
  if(qz.i>=qz.qs.length){
    el.innerHTML=modeBar+`<div class="flash" style="cursor:default"><div class="q-word">${qz.score} / ${qz.qs.length}</div><p class="q-ask">${qz.score>=qz.qs.length*.8?"बहुत बढ़िया! Excellent!":qz.score>=qz.qs.length*.5?"अच्छा प्रयास! Good try!":"अभ्यास करते रहो! Keep practising!"}</p><button class="btn primary" id="qAgain">नई क्विज़ · New quiz</button></div>`;return}
  const w=qz.qs[qz.i];
  if(!w._o||w._m!==qz.mode){w._o=optsFor(w);w._m=qz.mode}
  const ask=qz.mode==="meaning"?"इस शब्द का अंग्रेज़ी अर्थ चुनो · Choose the English meaning":"इस शब्द का विलोम चुनो · Choose the opposite word";
  el.innerHTML=modeBar+`<p class="score">Question ${qz.i+1} of ${qz.qs.length} · Score ${qz.score}</p>
   <div class="flash" style="cursor:default;min-height:180px"><div class="q-word" lang="hi">${esc(w.hi)}</div><p class="q-ask">${ask}</p></div>
   <div class="opts">${w._o.map(o=>`<button class="opt" data-opt="${esc(o)}">${esc(o)}</button>`).join("")}</div>
   <div id="qFeedback"></div>`;
}
function answer(btn){
  if(qz.answered)return;qz.answered=true;
  const w=qz.qs[qz.i],right=qz.mode==="meaning"?w.en:w.ha;
  document.querySelectorAll(".opt").forEach(b=>{if(b.dataset.opt===right)b.classList.add("right")});
  if(btn.dataset.opt===right)qz.score++;else btn.classList.add("wrong");
  $("#qFeedback").innerHTML=`<div class="card" style="margin-top:4px">${cardBody(w)}</div><div class="btns" style="margin-top:10px"><button class="btn primary" id="qNext">अगला · Next</button></div>`;
}

/* events */
function setView(v){view=v;["list","flash","quiz"].forEach(x=>{$("#view-"+x).hidden=x!==v;$("#tab-"+x).setAttribute("aria-selected",x===v)});
  if(v==="flash")buildDeck();if(v==="quiz")newQuiz();if(v==="list")renderList();}
document.querySelector("nav.tabs").addEventListener("click",e=>{const b=e.target.closest("[data-view]");if(b)setView(b.dataset.view)});
$("#levels").addEventListener("click",e=>{const b=e.target.closest("[data-lv]");if(!b)return;level=+b.dataset.lv;store.set("sk-level",level);renderLevels();setView(view)});
$("#search").addEventListener("input",renderList);
$("#grid").addEventListener("click",e=>{const k=e.target.closest("[data-know]");if(k){const id=+k.dataset.know;known.has(id)?known.delete(id):known.add(id);saveKnown();renderList();return}
  const s=e.target.closest("[data-say]");if(s)speak(WORDS[+s.dataset.say-1].hi)});
$("#flash").addEventListener("click",()=>{if(deck.length){flipped=!flipped;renderFlash();if(flipped)speak(WORDS[deck[di]-1].hi)}});
$("#flash").addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();$("#flash").click()}});
$("#fcKnow").addEventListener("click",()=>nextCard(true));
$("#fcAgain").addEventListener("click",()=>nextCard(false));
$("#onlyNew").addEventListener("change",buildDeck);
$("#quiz").addEventListener("click",e=>{
  const o=e.target.closest("[data-opt]");if(o)return answer(o);
  if(e.target.id==="qNext"){qz.i++;qz.answered=false;renderQuiz();return}
  if(e.target.id==="qAgain")return newQuiz();
  const m=e.target.closest("[data-mode]");if(m){qz.mode=m.dataset.mode;newQuiz()}
});
renderLevels();renderList();
</script>
</body>
</html>
